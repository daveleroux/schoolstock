<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="change-password" id="change-password">
    <div class="password-card">
        <h3>Change Password</h3>

        <div th:if="${passwordSuccess}" class="password-banner password-banner-success" role="status">
            Your password has been changed.
        </div>
        <div th:if="${passwordError}" class="password-banner password-banner-error" role="alert"
             th:text="${passwordError}">Error</div>

        <form hx-post="/account/password"
              hx-target="#change-password"
              hx-swap="outerHTML">
            <div class="password-field">
                <label for="current-password">Current password</label>
                <input type="password" id="current-password" name="currentPassword"
                       autocomplete="current-password" required>
            </div>
            <div class="password-field">
                <label for="new-password">New password</label>
                <input type="password" id="new-password" name="newPassword"
                       autocomplete="new-password" aria-describedby="password-requirements" required>
            </div>
            <div class="password-field">
                <label for="confirm-password">Confirm new password</label>
                <input type="password" id="confirm-password" name="confirmPassword"
                       autocomplete="new-password" required>
            </div>

            <div th:replace="~{fragments/password-requirements :: password-requirements('password-requirements')}"></div>

            <button type="submit" class="btn-submit-request">Change Password</button>
        </form>
    </div>
</div>
</body>
</html>
