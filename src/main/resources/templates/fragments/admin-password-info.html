<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Requirements shown under the Create User form; re-rendered with an error when a password is rejected. -->
<div th:fragment="admin-password-info" id="admin-password-info" class="admin-password-info">
    <div th:if="${passwordError}" class="password-banner password-banner-error" role="alert"
         th:text="${passwordError}">Error</div>
    <div th:replace="~{fragments/password-requirements :: password-requirements('admin-password-requirements')}"></div>
</div>
</body>
</html>
