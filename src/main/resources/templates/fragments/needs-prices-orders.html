<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="needs-prices-orders">

    <p th:if="${#lists.isEmpty(orders)}" class="empty-msg">No orders awaiting prices.</p>

    <div th:each="order : ${orders}" class="order-card">

        <div class="order-header">
            <div class="order-header-left">
                <span class="order-id">Order #<span th:text="${order.id}"></span></span>
                <span class="order-created-by" th:text="${order.createdBy.username}"></span>
            </div>
            <span class="order-date"
                  th:with="dt=${order.createdAt.atZone(T(java.time.ZoneOffset).UTC)}"
                  th:text="${#temporals.format(dt, 'dd MMM yyyy, HH:mm')} + ' UTC'">
            </span>
        </div>

        <div th:each="sub : ${order.subOrders}" class="sub-order-card">

            <div class="sub-order-header">
                <span class="sub-order-label">
                    Sub-order <span th:text="${sub.sequenceNumber}"></span>
                </span>
                <span class="state-badge"
                      th:classappend="${'state-' + sub.state.name().toLowerCase().replace('_', '-')}"
                      th:text="${sub.state.displayName}">
                </span>
                <form th:if="${sub.state.name() == 'NEEDS_PRICES'}"
                      th:attr="hx-post='/stock/sub-orders/' + ${sub.id} + '/capture-prices'"
                      hx-target="#needs-prices-orders"
                      hx-swap="innerHTML"
                      style="margin-left: auto">
                    <button type="submit" class="btn-capture-prices">Prices Captured</button>
                </form>
            </div>

            <table class="sub-order-items-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th class="col-qty">Qty</th>
                        <th th:if="${sub.state.name() == 'NEEDS_PRICES'}" class="col-price">Est. Price</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="soi : ${sub.items}"
                        th:classappend="${sub.state.name() == 'NEEDS_PRICES' and soi.estimatedPrice == null} ? 'row-price-missing' : ''">
                        <td>
                            <span th:text="${soi.item.name}"></span>
                            <span th:if="${soi.item.provisional}" class="badge-provisional">Provisional</span>
                        </td>
                        <td class="col-qty" th:text="${soi.quantity}"></td>
                        <td th:if="${sub.state.name() == 'NEEDS_PRICES'}" class="col-price">
                            <form th:attr="hx-post='/stock/sub-order-items/' + ${soi.id} + '/price'"
                                  hx-target="#needs-prices-orders"
                                  hx-swap="innerHTML"
                                  class="price-form">
                                <input type="number"
                                       name="price"
                                       step="0.01"
                                       min="0.01"
                                       th:value="${soi.estimatedPrice}"
                                       placeholder="0.00"
                                       class="price-input"
                                       required>
                                <button type="submit" class="btn-save-price">Save</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
