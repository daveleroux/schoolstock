<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Lists the password policy; any requirement named in ${failedRequirements} is highlighted. -->
<div th:fragment="password-requirements(id)" th:id="${id}" class="password-requirements">
    <span class="password-requirements-label">Password requirements:</span>
    <ul>
        <li th:each="req : ${@passwordPolicy.requirements}"
            th:text="${req}"
            th:classappend="${failedRequirements != null and failedRequirements.contains(req)} ? 'requirement-failed'">
            Requirement
        </li>
    </ul>
</div>
</body>
</html>
