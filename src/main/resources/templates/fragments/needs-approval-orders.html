<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="needs-approval-orders">

    <p th:if="${#lists.isEmpty(orders)}" class="empty-msg">No orders awaiting your approval.</p>

    <div th:each="order : ${orders}" class="order-card">

        <div class="order-header">
            <div class="order-header-left">
                <span class="order-id">Order #<span th:text="${order.id}"></span></span>
                <span class="order-created-by" th:text="${order.createdBy.username}"></span>
            </div>
            <span class="order-date"
                  th:with="dt=${order.createdAt.atZone(T(java.time.ZoneOffset).UTC)}"
                  th:text="${#temporals.format(dt, 'dd MMM yyyy, HH:mm')} + ' UTC'">
            </span>
        </div>

        <table class="order-items-table">
            <thead>
                <tr>
                    <th>Item</th>
                    <th class="col-qty">Qty</th>
                    <th class="col-price">Est. Price</th>
                    <th>State</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="oi : ${order.items}">
                    <td>
                        <span th:text="${oi.item.name}"></span>
                        <span th:if="${oi.item.provisional}" class="badge-provisional">Provisional</span>
                    </td>
                    <td class="col-qty" th:text="${oi.quantity}"></td>
                    <td class="col-price"
                        th:text="${oi.state.name() == 'NEEDS_APPROVAL' ? (oi.item.estimatedPrice != null ? oi.item.estimatedPrice : '—') : ''}">
                    </td>
                    <td>
                        <span class="state-badge"
                              th:classappend="${'state-' + oi.state.name().toLowerCase().replace('_', '-')}"
                              th:text="${oi.state.displayName}">
                        </span>
                    </td>
                    <td>
                        <div th:if="${oi.state.name() == 'NEEDS_APPROVAL'}" class="item-actions">
                            <form th:attr="hx-post='/approver/order-items/' + ${oi.id} + '/approve'"
                                  hx-target="#needs-approval-orders"
                                  hx-swap="innerHTML"
                                  hx-confirm="Approve this item? It will move to Awaiting Stock.">
                                <button type="submit" class="btn-approve">Approve</button>
                            </form>
                            <form th:attr="hx-post='/approver/order-items/' + ${oi.id} + '/cancel'"
                                  hx-target="#needs-approval-orders"
                                  hx-swap="innerHTML"
                                  hx-confirm="Cancel this item? This cannot be undone.">
                                <button type="submit" class="btn-cancel-item">Cancel</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
